name: Integration tests

on:
  workflow_dispatch:
    inputs:
      framework:
        description: Target framework
        type: choice
        options: [net9.0, net10.0, net11.0]
        default: net9.0
        required: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Run integration tests
        env:
          TEST_FRAMEWORK: ${{ inputs.framework }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/TestResults"
          dotnet run --project Tests/OpenDota.NET.IntegrationTests --configuration Release --framework "$TEST_FRAMEWORK" -- -maxThreads 2 -result-trx "$GITHUB_WORKSPACE/TestResults/integration.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults/integration.trx
          if-no-files-found: warn
