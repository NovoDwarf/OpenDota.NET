name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

  pack:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Validate release version
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$TAG" != v* ]]; then
            echo "Expected a tag starting with v" >&2
            exit 1
          fi
          version=${TAG#v}
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Expected a tag such as v5.0.0 or v5.0.0-rc.1" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Pack library
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          for project in OpenDota.NET OpenDota.NET.Microsoft.DependencyInjection; do
            dotnet pack "Sources/$project/$project.csproj" -c Release -o "$GITHUB_WORKSPACE/packages" -p:Version="$VERSION" -p:GeneratePackageOnBuild=false -p:ContinuousIntegrationBuild=true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: packages/*.nupkg
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - name: Authenticate with nuget.org
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'packages/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
      - name: Publish to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: dotnet nuget push 'packages/*.nupkg' --source "https://nuget.pkg.github.com/$REPOSITORY_OWNER/index.json" --api-key "$GH_TOKEN" --skip-duplicate
