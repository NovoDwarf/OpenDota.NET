name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore OpenDota.NET.slnx
      - name: Build all projects
        run: dotnet build OpenDota.NET.slnx --configuration Release --no-restore -p:GeneratePackageOnBuild=false
      - name: Test all frameworks
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/TestResults"
          status=0
          for project in OpenDota.NET.Tests OpenDota.NET.Microsoft.DependencyInjection.Tests; do
            for framework in net9.0 net10.0 net11.0; do
              dotnet run --project "Tests/$project" --configuration Release --framework "$framework" --no-build -- \
                -result-trx "$GITHUB_WORKSPACE/TestResults/$project-$framework.trx" || status=1
            done
          done
          exit "$status"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
