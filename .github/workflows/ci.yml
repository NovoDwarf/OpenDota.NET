name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore OpenDota.NET.slnx
      - name: Build all projects
        run: dotnet build OpenDota.NET.slnx --configuration Release --no-restore -p:GeneratePackageOnBuild=false
      - name: Test all frameworks
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/TestResults"
          status=0
          dotnet run --project Tests/OpenDota.NET.Tests --configuration Release --framework net9.0 --no-build -- \
            -maxThreads 2 -result-trx "$GITHUB_WORKSPACE/TestResults/net9.0.trx" || status=1
          for framework in net10.0 net11.0; do
            dotnet run --project Tests/OpenDota.NET.Tests --configuration Release --framework "$framework" --no-build -- \
              -class OpenDota.NET.Tests.RequestContractTests -class OpenDota.NET.Tests.ApiResponseDeserializationTests \
              -result-trx "$GITHUB_WORKSPACE/TestResults/$framework.trx" || status=1
          done
          exit "$status"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
